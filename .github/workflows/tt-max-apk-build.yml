name: TT Max Android APK
on:
  push:
    branches: [tt-max-apk-build]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android source
        run: |
          cd tt-max-build
          base64 -d project.tar.xz.base64 > project.tar.xz
          mkdir project
          tar -xJf project.tar.xz -C project
          test -f project/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile TT Max Android APK
        working-directory: tt-max-build/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TT-Max-debug-APK
          path: tt-max-build/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
